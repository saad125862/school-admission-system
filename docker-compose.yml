services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=school_admission;Username=school;Password=school_pw"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # URL the *browser* uses to reach the backend
      API_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
